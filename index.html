<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Drop Cabinet - Feed</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        /* Mencegah auto-zoom & loncatan placeholder saat diketik di HP */
        textarea, input {
            font-size: 15px !important;
        }
        textarea::placeholder, input::placeholder {
            font-size: 15px !important;
            color: #71767b;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-black text-[#e7e9ea] min-h-screen flex flex-col font-sans antialiased selection:bg-sky-500 selection:text-white">

    <!-- Kontainer Tengah Ala Twitter (Maksimal lebar 600px dengan garis batas kiri-kanan) -->
    <div class="max-w-[600px] w-full mx-auto min-h-screen border-x border-[#2f3336] flex flex-col">

        <!-- Header Sticky Ala Twitter -->
        <header class="sticky top-0 z-20 bg-black/80 backdrop-blur-md border-b border-[#2f3336] px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <!-- Avatar Mini Pengguna (Klik untuk buka Profil) -->
                <button onclick="openLoginModal()" id="headerAvatarBtn" class="w-8 h-8 rounded-full bg-sky-500 flex items-center justify-center text-white font-bold text-sm shrink-0">
                    A
                </button>
                <div>
                    <h1 class="font-bold text-base tracking-tight text-white leading-none">Drop Cabinet</h1>
                    <span class="text-[11px] text-[#71767b]">Untuk Anda</span>
                </div>
            </div>

            <button onclick="openLoginModal()" class="px-3 py-1 rounded-full border border-[#536471] hover:bg-white/10 text-xs font-bold text-white transition">
                <span id="headerLoginText">Atur Profil</span>
            </button>
        </header>

        <!-- Kotak Peringatan / Notifikasi -->
        <div id="alertBox" class="hidden bg-sky-500/15 border-b border-sky-500/30 text-sky-400 text-xs px-4 py-2.5 flex items-center gap-2">
            <i data-lucide="info" class="w-4 h-4 shrink-0"></i>
            <span id="alertText">Notifikasi sistem</span>
        </div>

        <!-- Kartu Profil Singkat (Muncul jika pengguna sudah isi nama/bio) -->
        <div id="userProfileCard" class="hidden border-b border-[#2f3336] px-4 py-3 bg-[#16181c]/50 flex items-center justify-between gap-3">
            <div class="min-w-0">
                <div class="flex items-center gap-1.5">
                    <span class="font-bold text-sm text-white truncate" id="profileDisplayName">Pengguna</span>
                    <span class="text-xs text-[#71767b] truncate" id="profileHandle">@pengguna</span>
                </div>
                <p id="profileBioText" class="text-xs text-[#e7e9ea] mt-0.5 truncate">Belum ada bio...</p>
            </div>
            <button onclick="openLoginModal()" class="text-xs text-sky-400 hover:underline shrink-0 font-medium">
                Edit
            </button>
        </div>

        <!-- Kotak Tulis Tweet / Postingan (Langsung di atas timeline seperti Twitter) -->
        <div class="border-b border-[#2f3336] p-4 flex gap-3">
            <!-- Avatar Bulat Kiri -->
            <div id="composerAvatar" class="w-10 h-10 rounded-full bg-gradient-to-tr from-sky-500 to-blue-600 flex items-center justify-center text-white font-bold text-base shrink-0 mt-0.5">
                A
            </div>

            <!-- Area Input Kanan -->
            <div class="flex-1 min-w-0 space-y-3">
                <textarea id="postContent" rows="2" placeholder="Apa yang sedang terjadi?" 
                    class="w-full bg-transparent text-[#e7e9ea] focus:outline-none resize-none leading-snug pt-1"></textarea>

                <!-- Pilihan Aura / Topik -->
                <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-1">
                    <label class="cursor-pointer shrink-0">
                        <input type="radio" name="postMood" value="chill" checked class="peer hidden">
                        <span class="text-[11px] px-2.5 py-1 rounded-full bg-transparent text-[#71767b] border border-[#2f3336] peer-checked:bg-sky-500/15 peer-checked:text-sky-400 peer-checked:border-sky-500/50 block transition font-medium">✨ Chill</span>
                    </label>
                    <label class="cursor-pointer shrink-0">
                        <input type="radio" name="postMood" value="rant" class="peer hidden">
                        <span class="text-[11px] px-2.5 py-1 rounded-full bg-transparent text-[#71767b] border border-[#2f3336] peer-checked:bg-rose-500/15 peer-checked:text-rose-400 peer-checked:border-rose-500/50 block transition font-medium">🔥 Rant</span>
                    </label>
                    <label class="cursor-pointer shrink-0">
                        <input type="radio" name="postMood" value="mystery" class="peer hidden">
                        <span class="text-[11px] px-2.5 py-1 rounded-full bg-transparent text-[#71767b] border border-[#2f3336] peer-checked:bg-purple-500/15 peer-checked:text-purple-400 peer-checked:border-purple-500/50 block transition font-medium">🔮 Mystery</span>
                    </label>
                    <label class="cursor-pointer shrink-0">
                        <input type="radio" name="postMood" value="melancholy" class="peer hidden">
                        <span class="text-[11px] px-2.5 py-1 rounded-full bg-transparent text-[#71767b] border border-[#2f3336] peer-checked:bg-blue-500/15 peer-checked:text-blue-400 peer-checked:border-blue-500/50 block transition font-medium">🌧️ Melancholy</span>
                    </label>
                </div>

                <!-- Garis Pembatas & Tombol Posting -->
                <div class="flex items-center justify-between pt-2.5 border-t border-[#2f3336]">
                    <span class="text-xs text-sky-400 font-medium flex items-center gap-1" id="currentPosterIndicator">
                        <i data-lucide="globe" class="w-3.5 h-3.5"></i>
                        <span>Semua orang dapat melihat</span>
                    </span>

                    <button onclick="savePost()" id="saveBtn" class="bg-[#1d9bf0] hover:bg-[#1a8cd8] active:scale-95 text-white font-bold text-sm px-4 py-1.5 rounded-full transition duration-150 shrink-0">
                        Posting
                    </button>
                </div>
            </div>
        </div>

        <!-- Timeline / Linimasa Postingan -->
        <main id="postsContainer" class="flex-1 divide-y divide-[#2f3336]">
            <div class="text-center py-12 text-[#71767b] text-xs flex flex-col items-center gap-2">
                <div class="w-5 h-5 border-2 border-[#2f3336] border-t-[#1d9bf0] rounded-full animate-spin"></div>
                Memuat linimasa...
            </div>
        </main>

    </div>

    <!-- Modal Edit Profil Ala Twitter -->
    <div id="loginModal" class="hidden fixed inset-0 z-50 bg-[#5b7083]/40 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-black border border-[#2f3336] rounded-2xl max-w-md w-full overflow-hidden shadow-2xl">
            <!-- Header Modal -->
            <div class="px-4 py-3 flex items-center justify-between border-b border-[#2f3336]">
                <div class="flex items-center gap-4">
                    <button onclick="closeLoginModal()" class="text-white hover:bg-white/10 w-8 h-8 rounded-full flex items-center justify-center text-sm">✕</button>
                    <h3 class="font-bold text-base text-white">Edit profil</h3>
                </div>
                <button onclick="saveLoginProfile()" class="px-4 py-1.5 rounded-full bg-white hover:bg-[#d7dbdc] text-black text-xs font-bold transition">
                    Simpan
                </button>
            </div>

            <!-- Banner & Avatar Ala Twitter -->
            <div class="h-24 bg-gradient-to-r from-[#1d9bf0]/40 to-indigo-900/40 relative"></div>
            <div class="px-4 pb-5">
                <div class="-mt-10 mb-4 w-20 h-20 rounded-full bg-sky-500 border-4 border-black flex items-center justify-center text-white font-bold text-2xl" id="modalAvatarPreview">
                    A
                </div>

                <div class="space-y-4">
                    <div class="border border-[#333639] focus-within:border-[#1d9bf0] rounded-md px-3 py-2 transition">
                        <label class="text-[11px] text-[#71767b] block">Nama</label>
                        <input type="text" id="inputLoginName" placeholder="Tambahkan nama kamu" maxlength="30"
                            class="w-full bg-transparent text-white focus:outline-none mt-0.5" />
                    </div>

                    <div class="border border-[#333639] focus-within:border-[#1d9bf0] rounded-md px-3 py-2 transition">
                        <label class="text-[11px] text-[#71767b] block">Bio</label>
                        <input type="text" id="inputLoginBio" placeholder="Tulis bio singkat..." maxlength="80"
                            class="w-full bg-transparent text-white focus:outline-none mt-0.5" />
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Hubungkan ke file script.js -->
    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) lucide.createIcons();
        });
    </script>
</body>
</html>

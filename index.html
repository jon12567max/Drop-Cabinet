<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drop Cabinet - Classic Profile</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-sky-500 selection:text-white font-sans antialiased">

    <!-- Header / Navigasi Atas -->
    <header class="sticky top-0 z-20 bg-slate-950/80 backdrop-blur-xl border-b border-slate-800/80 px-5 py-3.5 flex items-center justify-between shadow-lg shadow-black/20">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-2xl bg-gradient-to-tr from-sky-500/20 to-indigo-500/20 border border-sky-500/30 flex items-center justify-center text-sky-400 shadow-inner">
                <i data-lucide="layers" class="w-4 h-4"></i>
            </div>
            <div>
                <h1 class="font-bold text-sm tracking-wide bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">Drop Cabinet</h1>
                <p class="text-[10px] text-slate-500 font-medium">Classic Feed & Profile</p>
            </div>
        </div>

        <!-- Tombol Status Login / Profil -->
        <div id="authHeaderSection">
            <button onclick="openLoginModal()" class="px-3 py-1.5 rounded-xl bg-slate-900 border border-slate-700/60 text-slate-300 text-xs font-medium hover:border-sky-500 transition flex items-center gap-1.5">
                <i data-lucide="user-check" class="w-3.5 h-3.5 text-sky-400"></i>
                <span id="headerLoginText">Masuk / Profil</span>
            </button>
        </div>
    </header>

    <!-- Kontainer Utama -->
    <main class="flex-1 max-w-xl w-full mx-auto p-4 space-y-4 pb-44">
        
        <!-- Kartu Profil Pengguna (Ala Facebook 1.0) -->
        <div id="userProfileCard" class="hidden bg-slate-900/60 border border-slate-800/80 rounded-2xl p-4 shadow-xl backdrop-blur-md space-y-3">
            <div class="flex items-center justify-between border-b border-slate-800/80 pb-3">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-sky-500 to-blue-600 flex items-center justify-center text-white font-bold text-base shadow-md" id="profileAvatar">
                        A
                    </div>
                    <div>
                        <h2 class="font-bold text-sm text-slate-200" id="profileDisplayName">Nama Pengguna</h2>
                        <p class="text-[10px] text-sky-400 font-medium">Member Drop Cabinet</p>
                    </div>
                </div>
                <button onclick="openLoginModal()" class="text-[10px] px-2.5 py-1 rounded-lg bg-slate-800 text-slate-400 hover:text-white border border-slate-700 transition">
                    Ubah Profil
                </button>
            </div>
            <div class="text-xs text-slate-400">
                <span class="text-[10px] text-slate-500 block uppercase tracking-wider font-semibold">Tentang Saya (Bio):</span>
                <p id="profileBioText" class="mt-0.5 text-slate-300 italic">Belum ada status bio...</p>
            </div>
        </div>

        <!-- Linimasa Pesan -->
        <div id="postsContainer" class="space-y-3.5">
            <div class="text-center py-12 text-slate-500 text-xs flex flex-col items-center gap-2">
                <div class="w-6 h-6 border-2 border-slate-700 border-t-sky-500 rounded-full animate-spin"></div>
                Memuat pesan publik...
            </div>
        </div>
    </main>

    <!-- Footer / Kotak Input Pesan Floating -->
    <footer class="fixed bottom-4 left-4 right-4 z-30 max-w-xl mx-auto">
        <!-- Kotak Peringatan / Error -->
        <div id="alertBox" class="hidden mb-2 px-3.5 py-2.5 rounded-2xl bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs flex items-center gap-2.5 shadow-xl backdrop-blur-md">
            <i data-lucide="alert-circle" class="w-4 h-4 shrink-0"></i>
            <span id="alertText">Pesan ditolak sistem!</span>
        </div>

        <div class="bg-slate-900/95 backdrop-blur-2xl rounded-3xl border border-slate-800/80 p-3.5 space-y-2.5 shadow-2xl shadow-black/80 ring-1 ring-white/5">
            <!-- Input Isi Pesan -->
            <div class="px-3 py-2 rounded-xl bg-slate-950/60 border border-slate-800/60 focus-within:border-sky-500/50 transition">
                <textarea id="postContent" rows="2" placeholder="Tulis pesan publikmu di sini..." 
                    class="w-full bg-transparent text-slate-100 placeholder-slate-600 text-xs focus:outline-none resize-none leading-relaxed"></textarea>
            </div>

            <!-- Pilihan Mood Aura -->
            <div class="flex items-center gap-1.5 overflow-x-auto pb-0.5">
                <span class="text-[10px] text-slate-500 shrink-0 font-medium">Aura:</span>
                <label class="cursor-pointer shrink-0">
                    <input type="radio" name="postMood" value="chill" checked class="peer hidden">
                    <span class="text-[10px] px-2.5 py-1 rounded-lg bg-slate-950/60 text-slate-400 border border-slate-800 peer-checked:bg-sky-500/15 peer-checked:text-sky-400 peer-checked:border-sky-500/40 block transition">✨ Chill</span>
                </label>
                <label class="cursor-pointer shrink-0">
                    <input type="radio" name="postMood" value="rant" class="peer hidden">
                    <span class="text-[10px] px-2.5 py-1 rounded-lg bg-slate-950/60 text-slate-400 border border-slate-800 peer-checked:bg-rose-500/15 peer-checked:text-rose-400 peer-checked:border-rose-500/40 block transition">🔥 Rant</span>
                </label>
                <label class="cursor-pointer shrink-0">
                    <input type="radio" name="postMood" value="mystery" class="peer hidden">
                    <span class="text-[10px] px-2.5 py-1 rounded-lg bg-slate-950/60 text-slate-400 border border-slate-800 peer-checked:bg-purple-500/15 peer-checked:text-purple-400 peer-checked:border-purple-500/40 block transition">🔮 Mystery</span>
                </label>
                <label class="cursor-pointer shrink-0">
                    <input type="radio" name="postMood" value="melancholy" class="peer hidden">
                    <span class="text-[10px] px-2.5 py-1 rounded-lg bg-slate-950/60 text-slate-400 border border-slate-800 peer-checked:bg-blue-500/15 peer-checked:text-blue-400 peer-checked:border-blue-500/40 block transition">🌧️ Melancholy</span>
                </label>
            </div>
            
            <!-- Tombol Kirim -->
            <div class="flex items-center justify-between pt-1.5 border-t border-slate-800/60">
                <span class="text-[10px] text-slate-500" id="currentPosterIndicator">Posting sebagai: <b>Anonim</b></span>

                <button onclick="savePost()" id="saveBtn" class="bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-400 hover:to-blue-500 active:scale-95 text-white font-medium text-xs px-5 py-2 rounded-xl transition duration-150 flex items-center gap-2 shadow-lg shadow-sky-500/25 shrink-0">
                    <span>Posting</span>
                    <i data-lucide="send" class="w-3.5 h-3.5"></i>
                </button>
            </div>
        </div>
    </footer>

    <!-- Modal Login / Atur Profil Sederhana -->
    <div id="loginModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5 max-w-sm w-full space-y-4 shadow-2xl">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                <h3 class="font-bold text-sm text-slate-200">Identitas Profil Kamu</h3>
                <button onclick="closeLoginModal()" class="text-slate-400 hover:text-white text-xs">✕</button>
            </div>
            <div class="space-y-3">
                <div>
                    <label class="text-[10px] text-slate-400 block mb-1">Nama / Panggilan:</label>
                    <input type="text" id="inputLoginName" placeholder="Contoh: Budi Santoso" maxlength="30"
                        class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-800 text-xs text-slate-200 focus:outline-none focus:border-sky-500" />
                </div>
                <div>
                    <label class="text-[10px] text-slate-400 block mb-1">Bio Singkat (Status Profil):</label>
                    <input type="text" id="inputLoginBio" placeholder="Contoh: Suka kopi & teknologi" maxlength="60"
                        class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-800 text-xs text-slate-200 focus:outline-none focus:border-sky-500" />
                </div>
            </div>
            <div class="flex justify-end gap-2 pt-2 border-t border-slate-800">
                <button onclick="closeLoginModal()" class="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 text-xs">Batal</button>
                <button onclick="saveLoginProfile()" class="px-4 py-2 rounded-xl bg-sky-500 hover:bg-sky-400 text-white text-xs font-medium">Simpan Profil</button>
            </div>
        </div>
    </div>

    <!-- Hubungkan ke file script.js -->
    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) lucide.createIcons();
        });
    </script>
</body>
</html>

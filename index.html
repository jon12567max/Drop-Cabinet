<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drop Cabinet - Ruang Pesan Anonim</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-sky-500 selection:text-white">

    <!-- Header / Navigasi Atas -->
    <header class="sticky top-0 z-20 bg-slate-950/80 backdrop-blur-md border-b border-slate-800/80 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-xl bg-sky-500/10 border border-sky-500/30 flex items-center justify-center text-sky-400">
                <i data-lucide="message-square-code" class="w-4 h-4"></i>
            </div>
            <div>
                <h1 class="font-bold text-sm tracking-wide">Drop Cabinet</h1>
                <p class="text-[10px] text-slate-400">Ruang Pesan Anonim</p>
            </div>
        </div>
        <div class="flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-[10px] font-medium">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
            <span>Online</span>
        </div>
    </header>

    <!-- Kontainer Linimasa Pesan (Jarak Bawah pb-36 Agar Tidak Tertutup Input Floating) -->
    <main class="flex-1 max-w-xl w-full mx-auto p-4 space-y-3 pb-36">
        <div id="postsContainer" class="space-y-3">
            <div class="text-center py-10 text-slate-500 text-xs">
                Memuat pesan...
            </div>
        </div>
    </main>

    <!-- Footer / Kotak Input Pesan Floating (Aman dari Badge Netlify) -->
    <footer class="fixed bottom-6 left-4 right-4 z-30 max-w-xl mx-auto">
        <!-- Kotak Peringatan / Error -->
        <div id="alertBox" class="hidden mb-2 px-3 py-2 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs flex items-center gap-2 shadow-lg backdrop-blur-md">
            <i data-lucide="alert-triangle" class="w-4 h-4 shrink-0"></i>
            <span id="alertText">Pesan ditolak sistem!</span>
        </div>

        <div class="bg-slate-900/95 backdrop-blur-md rounded-2xl border border-slate-800 p-3.5 space-y-2.5 shadow-2xl shadow-black/80">
            <!-- Input Nama Pengirim -->
            <div class="flex items-center gap-2 pb-2 border-b border-slate-800/60">
                <i data-lucide="user" class="w-3.5 h-3.5 text-slate-500 shrink-0"></i>
                <input type="text" id="senderName" placeholder="Nama / Panggilan (Opsional)" 
                    maxlength="30"
                    class="w-full bg-transparent text-slate-200 placeholder-slate-600 text-xs focus:outline-none" />
            </div>

            <!-- Input Isi Pesan -->
            <textarea id="postContent" rows="2" placeholder="Tulis pesan atau unek-unekmu di sini..." 
                class="w-full bg-transparent text-slate-100 placeholder-slate-500 text-sm focus:outline-none resize-none leading-relaxed"></textarea>
            
            <div class="flex items-center justify-between pt-2 border-t border-slate-800/60 mt-1">
                <span class="text-[10px] text-slate-500">Strict Link Blocker</span>
                <!-- Tombol Kirim -->
                <button onclick="savePost()" id="saveBtn" class="bg-sky-500 hover:bg-sky-400 active:scale-95 text-white font-semibold text-xs px-4 py-2 rounded-full transition duration-150 flex items-center gap-1.5 shadow-lg shadow-sky-500/20 shrink-0">
                    <span>Posting</span>
                    <i data-lucide="send" class="w-3.5 h-3.5"></i>
                </button>
            </div>
        </div>
    </footer>

    <!-- Hubungkan ke file script.js -->
    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) lucide.createIcons();
        });
    </script>
</body>
</html>

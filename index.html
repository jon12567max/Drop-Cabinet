<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Drop Cabinet</title>
    
    <!-- Hubungkan ke Pure CSS buatan sendiri -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="twitter-container">

        <!-- Header -->
        <header>
            <div class="header-left">
                <button onclick="openLoginModal()" id="headerAvatarBtn" class="avatar-btn">A</button>
                <div class="header-title">
                    <h1>Drop Cabinet</h1>
                    <span>Twitter Layout</span>
                </div>
            </div>
            <button onclick="openLoginModal()" class="profile-btn" id="headerLoginText">Atur Profil</button>
        </header>

        <!-- Komposer Pesan / Tweet Box -->
        <div class="composer-box">
            <div class="composer-avatar" id="composerAvatar">A</div>
            <div class="composer-right">
                <textarea id="postContent" rows="2" placeholder="Apa yang sedang terjadi?"></textarea>
                
                <!-- Pilihan Aura -->
                <div class="mood-selector">
                    <label>
                        <input type="radio" name="postMood" value="chill" checked>
                        <span class="mood-chip">✨ Chill</span>
                    </label>
                    <label>
                        <input type="radio" name="postMood" value="rant">
                        <span class="mood-chip">🔥 Rant</span>
                    </label>
                    <label>
                        <input type="radio" name="postMood" value="mystery">
                        <span class="mood-chip">🔮 Mystery</span>
                    </label>
                    <label>
                        <input type="radio" name="postMood" value="melancholy">
                        <span class="mood-chip">🌧️ Melancholy</span>
                    </label>
                </div>

                <div class="composer-footer">
                    <span class="poster-indicator" id="currentPosterIndicator">Posting sebagai Anonim</span>
                    <button onclick="savePost()" id="saveBtn" class="post-btn">Posting</button>
                </div>
            </div>
        </div>

        <!-- Linimasa / Timeline -->
        <main id="postsContainer">
            <div style="text-align: center; padding: 40px; color: #71767b; font-size: 13px;">
                Memuat linimasa...
            </div>
        </main>

    </div>

    <!-- Modal Profil -->
    <div id="loginModal" class="modal-overlay hidden">
        <div class="modal-card">
            <div class="modal-header">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <button onclick="closeLoginModal()" class="modal-close">✕</button>
                    <h3 style="font-size: 16px; font-weight: bold;">Edit profil</h3>
                </div>
                <button onclick="saveLoginProfile()" class="post-btn" style="padding: 6px 14px; font-size: 12px;">Simpan</button>
            </div>
            <div class="modal-body">
                <div class="input-group">
                    <label>Nama</label>
                    <input type="text" id="inputLoginName" placeholder="Nama kamu" maxlength="30" />
                </div>
                <div class="input-group">
                    <label>Bio</label>
                    <input type="text" id="inputLoginBio" placeholder="Tulis bio singkat..." maxlength="60" />
                </div>
            </div>
        </div>
    </div>

    <!-- Script Utama -->
    <script src="script.js"></script>
</body>
</html>
